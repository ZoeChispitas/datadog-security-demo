name: Datadog Security Gate & CI Visibility

on:
  push:
    branches: [ main, test/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flake8 pytest requests flask

      - name: Run Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mark Deployment & Incident in Datadog
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: datadoghq.com
        run: |
          npm install -g @datadog/datadog-ci
          
          # 1. Registrar el despliegue
          DEPLOY_START=$(date -d "6 minutes ago" +%s)
          DEPLOY_END=$(date -d "5 minutes ago" +%s)
          datadog-ci dora deployment \
            --service datadog-security-demo \
            --env production \
            --started-at "$DEPLOY_START" \
            --finished-at "$DEPLOY_END" \
            --git-repository-url "https://github.com/ZoeChispitas/datadog-security-demo" \
            --git-commit-sha "${{ github.sha }}"

          # 2. Registrar la falla e incidente resuelto (puebla Change Failure Rate y Recovery Time)
          INCIDENT_START=$(date -d "5 minutes ago" +%s)
          INCIDENT_END=$(date +%s)
          datadog-ci dora incident \
            --service datadog-security-demo \
            --env production \
            --started-at "$INCIDENT_START" \
            --finished-at "$INCIDENT_END" \
            --git-repository-url "https://github.com/ZoeChispitas/datadog-security-demo" \
            --git-commit-sha "${{ github.sha }}" \
            --severity "SEV-1"
