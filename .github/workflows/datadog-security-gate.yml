name: Datadog Security Gate & CI Visibility

on:
  push:
    branches: [ main, test/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flake8 pytest requests flask

      - name: Run Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mark Deployment & Incident in Datadog
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: datadoghq.com
        run: |
          npm install -g @datadog/datadog-ci
          
          # 1. Registrar el despliegue
          DEPLOY_START=$(date -d "12 minutes ago" +%s)
          DEPLOY_END=$(date -d "10 minutes ago" +%s)
          datadog-ci dora deployment \
            --service datadog-security-demo \
            --env production \
            --started-at "$DEPLOY_START" \
            --finished-at "$DEPLOY_END" \
            --git-repository-url "https://github.com/ZoeChispitas/datadog-security-demo" \
            --git-commit-sha "${{ github.sha }}"

          # 2. Registrar el incidente en segundos (Unix Epoch)
          INC_START=$(date -d "10 minutes ago" +%s)
          INC_END=$(date -d "2 minutes ago" +%s)
          
          curl -s -X POST "https://api.datadoghq.com/api/v2/dora/incident" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DD_API_KEY }}" \
            -d "{
              \"data\": {
                \"attributes\": {
                  \"env\": \"production\",
                  \"name\": \"Degradacion de servicio en produccion\",
                  \"services\": [\"datadog-security-demo\"],
                  \"severity\": \"SEV-1\",
                  \"started_at\": $INC_START,
                  \"finished_at\": $INC_END,
                  \"git\": {
                    \"repository_url\": \"https://github.com/ZoeChispitas/datadog-security-demo\",
                    \"commit_sha\": \"${{ github.sha }}\"
                  }
                }
              }
            }"
